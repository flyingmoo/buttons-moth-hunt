<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buttons Moth Kill Count 🐱</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600&display=swap" rel="stylesheet">
<style>
body { 
  font-family: 'Baloo 2', cursive; 
  background: #f0f0f0;
  margin: 0; 
  padding: 0; 
  display: flex; 
  justify-content: center; 
  align-items: flex-start; 
  min-height: 100vh;
  color: black;
}

.frame {
  background: #ffeaf2; /* slightly lighter pink */
  border-radius: 15px;
  box-shadow: 0 10px 20px rgba(0,0,0,0.3);
  padding: 20px;
  margin: 20px;
  width: 90%;
  max-width: 500px;
  text-align: center;
  color: black;
  font-weight: bold; 
  position: relative;
}

.image-wrapper {
  background: #ffeaf2;
  padding: 15px;
  border-radius: 15px;
  display: inline-block;
  margin-bottom: 20px;
  position: relative;
}

img { 
  max-width: 100%; 
  height: auto;
  border-radius: 10px; 
}

/* Sparkles over image */
.sparkle {
  position: absolute;
  width: 10px;
  height: 10px;
  background: radial-gradient(circle, #fffacd 0%, #ffd700 80%);
  border-radius: 50%;
  opacity: 0;
  animation: sparkleAnim 2s linear infinite;
}

@keyframes sparkleAnim {
  0% { opacity: 0; transform: translate(0,0) scale(0.5);}
  25% { opacity: 1; transform: translate(5px,-10px) scale(1);}
  50% { opacity: 0; transform: translate(10px,5px) scale(0.5);}
  75% { opacity: 1; transform: translate(-5px,-5px) scale(0.8);}
  100% { opacity: 0; transform: translate(0,0) scale(0.5);}
}

/* Stats and buttons */
.stats { 
  margin: 20px 0; 
  font-weight: bold;
}

.stats p { 
  margin: 8px 0; 
  font-size: 18px;
}

#mothCount { font-size: 20px; }
#xpBarContainer {
  background: #ddd;
  border-radius: 10px;
  overflow: hidden;
  margin: 8px 0;
  width: 80%;
  height: 20px;
  display: inline-block;
  vertical-align: middle;
  box-shadow: inset 0 0 3px rgba(0,0,0,0.3);
}

#xpBar {
  height: 100%;
  background: #4CAF50;
  width: 0%;
  transition: width 0.5s ease;
}

.levelIcon {
  display: inline-block;
  width: 30px;
  height: 30px;
  background: gold;
  border-radius: 50%;
  line-height: 30px;
  font-weight: bold;
  margin-left: 8px;
  color: black;
}

.title {
  font-family: 'Baloo 2', cursive;
  font-size: 28px;
  margin: 15px 0;
  text-shadow: 1px 1px 2px #ffd700;
}

/* Buttons with cute font */
button { 
  font-family: 'Baloo 2', cursive; /* cute thinner font */
  font-size: 18px; 
  padding: 12px 20px; 
  margin: 5px; 
  border: none; 
  border-radius: 8px; 
  cursor: pointer; 
  transition: all 0.2s ease; 
  box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  min-width: 120px;
  font-weight: 600;
}
button:disabled { 
  opacity: 0.5; 
  cursor: not-allowed; 
}
#addMothBtn { background: #4CAF50; color: white; }
#addMothBtn:hover:not(:disabled) { background: #45a049; transform: translateY(-2px); }
#resetMothBtn { background: #f44336; color: white; }
#resetMothBtn:hover:not(:disabled) { background: #e53935; transform: translateY(-2px); }

#login input { padding: 8px; margin: 0 5px; border-radius: 5px; border: 1px solid #ccc; width: 40%; font-weight: 600; font-family: 'Baloo 2', cursive; }
#login button { padding: 8px 15px; border-radius: 5px; font-weight: 600; font-family: 'Baloo 2', cursive; }

/* Trophies section */
.trophies-frame {
  background: #f0f0f0; 
  border-radius: 15px;
  padding: 20px;
  margin-top: 30px;
  border: 4px solid #ffd700; 
  box-shadow: 0 0 15px #ffd700, 0 0 30px #fffacd;
  overflow: hidden;
  position: relative;
}

.trophies-frame h2 { 
  font-size: 22px; 
  margin-bottom: 15px; 
  text-shadow: 1px 1px 2px #ccc;
}

.trophies-frame ul {
  list-style: none;
  padding: 0;
  display: inline-block; 
  columns: 2;
  column-gap: 20px;
  text-align: left;
  font-size: 16px;
  width: 100%;
  font-weight: bold;
}

.trophies-frame li {
  padding: 3px 0;
  display: block;
  white-space: nowrap; 
  position: relative;
}

.trophies-frame li.earned { 
  color: black;
  font-weight: bold;
  animation: sparkle 2s linear infinite;
  text-shadow: 0 0 5px #ffd700, 0 0 10px #ffd700, 0 0 15px #fffacd;
}

.trophies-frame li.inactive { 
  color: #999; /* lighter font for unearned */
}

.trophies-frame li:nth-child(8) { break-inside: avoid-column; }

/* sparkle animation */
@keyframes sparkle {
  0%, 100% { text-shadow: 0 0 5px #ffd700, 0 0 10px #ffd700, 0 0 15px #fffacd; }
  50% { text-shadow: 0 0 10px #fffacd, 0 0 20px #ffd700, 0 0 25px #ffd700; }
}

@media screen and (max-width: 480px) {
  .trophies-frame ul { columns: 1; column-gap: 0; }
  #login input { width: 70%; margin: 5px 0; }
  button { font-size: 16px; min-width: 100px; padding: 10px 15px; }
}
</style>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>
</head>
<body>

<div class="frame cute-font">
  <h1 class="cute-font">Buttons Moth Kill Count 🐱</h1>

  <div class="image-wrapper">
    <img src="buttons.jpg" alt="Buttons the Cat">
    <div class="sparkle"></div>
    <div class="sparkle" style="animation-delay: 0.5s; left: 50%; top: 20%;"></div>
    <div class="sparkle" style="animation-delay: 1s; left: 70%; top: 10%;"></div>
  </div>

  <div class="stats cute-font">
    <p>Moths hunted: <span id="mothCount">0</span> 🦋</p>
    <div>
      <span>Level:</span> <span class="levelIcon" id="level">1</span>
      <div id="xpBarContainer">
        <div id="xpBar"></div>
      </div>
    </div>
    <div class="title">Title: <span id="title">Novice Hunter</span></div>
  </div>

  <div>
    <button id="addMothBtn" disabled>+1 Moth</button>
    <button id="resetMothBtn" disabled>Reset Moths</button>
  </div>

  <div class="trophies-frame">
    <h2>Trophies 🏆</h2>
    <ul id="trophyList"></ul>
  </div>

  <div id="login" style="margin-top: 20px;">
    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, updateDoc, onSnapshot, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC1HnYKrEwO4uEF1VluSzHnr0EgOUYHhUs",
  authDomain: "buttons-moth-rpg.firebaseapp.com",
  projectId: "buttons-moth-rpg"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const statsRef = doc(db, "stats", "buttons");

let state = { mothCount: 0, xp: 0, level: 1, hunts: [] };
let isAdmin = false;

const trophyMilestones = [
  { count: 1, icon: "🎯", trophy: "First Catch", title: "L Plater" },
  { count: 5, icon: "👀", trophy: "Look at Me Mum!", title: "P Plater" },
  { count: 10, icon: "🔟", trophy: "La Decima", title: "Work Experience Kid" },
  { count: 20, icon: "💼", trophy: "It's a Living", title: "Low Level Salaryman" },
  { count: 30, icon: "📈", trophy: "Thirty and Thriving", title: "Middle Management" },
  { count: 40, icon: "☕", trophy: "Caffeine Mandatory", title: "Head of Moth Engagement" },
  { count: 50, icon: "🏆", trophy: "Half a Century!", title: "Director of Moth Management" },
  { count: 60, icon: "💰", trophy: "Retirement? Never!", title: "Chief Executive Mofficer" },
  { count: 70, icon: "🐾", trophy: "Hard at Work", title: "Senior VP of Moth Operations" },
  { count: 80, icon: "🐱", trophy: "I'm Not a Cat", title: "VP of Pest Control" },
  { count: 90, icon: "🐐", trophy: "I'm a GOAT", title: "Chief of Feline Strategy" },
  { count: 100, icon: "💯", trophy: "One Hundred Meows", title: "Supreme Moth Overlord" }
];

window.login = async function() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  try { await signInWithEmailAndPassword(auth, email, password); alert("Logged in as admin!"); }
  catch (err) { alert("Login failed: " + err.message); }
};

onAuthStateChanged(auth, user => {
  isAdmin = !!user;
  document.getElementById("addMothBtn").disabled = !isAdmin;
  document.getElementById("resetMothBtn").disabled = !isAdmin;
  document.getElementById("login").style.display = isAdmin ? "none" : "block";
});

function render() {
  document.getElementById("mothCount").textContent = state.mothCount;
  document.getElementById("level").textContent = state.level;

  const earned = trophyMilestones.filter(t => state.mothCount >= t.count);
  document.getElementById("title").textContent = earned.length ? earned[earned.length - 1].title : "Novice Hunter";

  const xpPercent = Math.min((state.xp / (state.level * 50)) * 100, 100);
  document.getElementById("xpBar").style.width = xpPercent + "%";

  renderTrophies();
}

async function addMoth() {
  if (!isAdmin) return;
  try {
    const snap = await getDoc(statsRef);
    if (!snap.exists()) return alert("Firestore document missing!");
    state = snap.data();
    state.mothCount++;
    state.hunts.push(`🦋 ${new Date().toLocaleString()}`);
    state.xp += 10;
    while (state.xp >= state.level * 50) { state.xp -= state.level * 50; state.level++; }
    await updateDoc(statsRef, state);
  } catch (err) { alert("Error: " + err.message); }
}

async function resetMoths() {
  if (!isAdmin) return;
  try {
    const snap = await getDoc(statsRef);
    if (!snap.exists()) return alert("Firestore document missing!");
    state = snap.data();
    state.mothCount = 0; state.xp = 0; state.level = 1; state.hunts = [];
    await updateDoc(statsRef, state);
  } catch (err) { alert("Error: " + err.message); }
}

function renderTrophies() {
  const trophyList = document.getElementById("trophyList");
  trophyList.innerHTML = "";
  trophyMilestones.forEach((t) => {
    const li = document.createElement("li");
    li.textContent = `${t.icon} ${t.trophy} (${t.count})`;
    li.classList.add(state.mothCount >= t.count ? "earned" : "inactive");
    trophyList.appendChild(li);
  });
}

onSnapshot(statsRef, snap => { if (snap.exists()) { state = snap.data(); render(); } });

window.addMoth = addMoth;
window.resetMoths = resetMoths;
document.getElementById("addMothBtn").addEventListener("click", addMoth);
document.getElementById("resetMothBtn").addEventListener("click", resetMoths);

</script>
</body>
</html>
