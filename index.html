<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buttons Moth Kill Count 🐱</title>
<style>
body { 
  font-family: 'Segoe UI', sans-serif; 
  background: #f0f0f0;
  margin: 0; 
  padding: 0; 
  display: flex; 
  justify-content: center; 
  align-items: flex-start; 
  min-height: 100vh;
  color: black;
}

.frame {
  background: white;
  border-radius: 15px;
  box-shadow: 0 10px 20px rgba(0,0,0,0.3);
  padding: 20px;
  margin: 20px;
  width: 90%;
  max-width: 500px;
  text-align: center;
  color: black;
}

/* Light pink background behind Buttons' image */
.image-wrapper {
  background: #ffc0cb; /* light pink */
  padding: 15px;
  border-radius: 15px;
  display: inline-block;
  margin-bottom: 20px;
}

img { 
  max-width: 100%; 
  height: auto;
  border-radius: 10px; 
}

.stats { 
  margin: 20px 0; 
  font-size: 18px; 
}

button { 
  font-size: 18px; 
  padding: 12px 20px; 
  margin: 5px; 
  border: none; 
  border-radius: 8px; 
  cursor: pointer; 
  transition: all 0.2s ease; 
  box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  min-width: 120px;
}
button:disabled { 
  opacity: 0.5; 
  cursor: not-allowed; 
}
#addMothBtn { background: #4CAF50; color: white; }
#addMothBtn:hover:not(:disabled) { background: #45a049; transform: translateY(-2px); }
#resetMothBtn { background: #f44336; color: white; }
#resetMothBtn:hover:not(:disabled) { background: #e53935; transform: translateY(-2px); }

#login input { padding: 8px; margin: 0 5px; border-radius: 5px; border: 1px solid #ccc; width: 40%; }
#login button { padding: 8px 15px; border-radius: 5px; }

/* Trophy Section Frame with more accented border */
.trophies-frame {
  background: linear-gradient(145deg, #fff, #f8f8ff);
  border-radius: 15px;
  padding: 20px;
  margin-top: 30px;
  border: 3px solid #ff69b4; /* bright pink border */
  box-shadow: 0 8px 15px rgba(255, 105, 180, 0.4), 0 0 20px rgba(255, 105, 180, 0.6);
  overflow: hidden;
}

.trophies-frame h2 { 
  font-size: 22px; 
  margin-bottom: 15px; 
  text-shadow: 1px 1px 2px #ccc;
}

.trophies-frame ul {
  list-style: none;
  padding: 0;
  display: inline-block; /* centers list */
  columns: 2;
  column-gap: 20px;
  text-align: left; /* left-align trophies in columns */
  font-size: 16px;
  width: 100%;
}

.trophies-frame li {
  padding: 3px 0;
  display: block;
  white-space: nowrap; /* prevent line breaks */
}

.trophies-frame li.earned { 
  color: gold; 
  font-weight: bold; 
  transform: scale(1.05);
  animation: sparkleLoop 2s infinite;
}

/* Continuous sparkle animation */
@keyframes sparkleLoop {
  0%, 100% { transform: scale(1) rotate(0deg); text-shadow: 0 0 2px gold; }
  25% { transform: scale(1.05) rotate(2deg); text-shadow: 0 0 6px gold, 0 0 10px #fff; }
  50% { transform: scale(1.1) rotate(-2deg); text-shadow: 0 0 8px gold, 0 0 12px #fff; }
  75% { transform: scale(1.05) rotate(2deg); text-shadow: 0 0 6px gold, 0 0 10px #fff; }
}

/* Force 50th trophy to start in second column */
.trophies-frame li:nth-child(8) {
  break-inside: avoid-column;
  page-break-inside: avoid;
  column-break-inside: avoid;
}

/* Mobile responsiveness */
@media screen and (max-width: 480px) {
  .trophies-frame ul {
    columns: 1; /* single column on small screens */
    column-gap: 0;
  }
  #login input {
    width: 70%;
    margin: 5px 0;
  }
  button {
    font-size: 16px;
    min-width: 100px;
    padding: 10px 15px;
  }
}
</style>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>
</head>
<body>

<div class="frame">
  <h1>Buttons Moth Kill Count 🐱</h1>

  <div class="image-wrapper">
    <img src="buttons.jpg" alt="Buttons the Cat">
  </div>

  <div class="stats">
    <p>Moths hunted: <span id="mothCount">0</span></p>
    <p>XP: <span id="xp">0</span></p>
    <p>Level: <span id="level">1</span></p>
    <p>Title: <span id="title">Novice Hunter</span></p>
  </div>

  <div>
    <button id="addMothBtn" disabled>+1 Moth</button>
    <button id="resetMothBtn" disabled>Reset Moths</button>
  </div>

  <div class="trophies-frame">
    <h2>Trophies 🏆</h2>
    <ul id="trophyList"></ul>
  </div>

  <div id="login" style="margin-top: 20px;">
    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, updateDoc, onSnapshot, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// 🔹 Replace with your Firebase Web App values
const firebaseConfig = {
  apiKey: "AIzaSyC1HnYKrEwO4uEF1VluSzHnr0EgOUYHhUs",
  authDomain: "buttons-moth-rpg.firebaseapp.com",
  projectId: "buttons-moth-rpg"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const statsRef = doc(db, "stats", "buttons");

let state = { mothCount: 0, xp: 0, level: 1, hunts: [] };
let isAdmin = false;

const trophyMilestones = [
  { count: 1, icon: "🩸", trophy: "First Blood", title: "L Plater" },
  { count: 5, icon: "👀", trophy: "Look at Me Mum!", title: "P Plater" },
  { count: 10, icon: "🔟", trophy: "La Decima", title: "Work Experience Kid" },
  { count: 20, icon: "💼", trophy: "It's a Living", title: "Low Level Salaryman" },
  { count: 30, icon: "📈", trophy: "Thirty and Thriving", title: "Middle Management" },
  { count: 40, icon: "☕", trophy: "Caffeine Mandatory", title: "Head of Moth Engagement" },
  { count: 50, icon: "🏆", trophy: "Half a Century!", title: "Director of Moth Management" },
  { count: 60, icon: "💼", trophy: "Retirement? Never!", title: "Chief Executive Mofficer" }, // 🐱 removed
  { count: 70, icon: "🐾", trophy: "Hard at Work", title: "Senior VP of Moth Operations" },
  { count: 80, icon: "🐱", trophy: "I'm Not a Cat", title: "VP of Pest Control" },
  { count: 90, icon: "🐐", trophy: "I'm a GOAT", title: "Chief of Feline Strategy" },
  { count: 100, icon: "💯", trophy: "One Hundred Meows", title: "Supreme Moth Overlord" }
];

window.login = async function() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  try {
    await signInWithEmailAndPassword(auth, email, password);
    alert("Logged in as admin!");
  } catch (err) {
    alert("Login failed: " + err.message);
  }
};

onAuthStateChanged(auth, user => {
  isAdmin = !!user;
  document.getElementById("addMothBtn").disabled = !isAdmin;
  document.getElementById("resetMothBtn").disabled = !isAdmin;
  document.getElementById("login").style.display = isAdmin ? "none" : "block";
});

function render() {
  document.getElementById("mothCount").textContent = state.mothCount;
  document.getElementById("xp").textContent = state.xp;
  document.getElementById("level").textContent = state.level;

  const earned = trophyMilestones.filter(t => state.mothCount >= t.count);
  document.getElementById("title").textContent = earned.length ? earned[earned.length - 1].title : "Novice Hunter";

  renderTrophies();
}

async function addMoth() {
  if (!isAdmin) return;
  try {
    const snap = await getDoc(statsRef);
    if (!snap.exists()) return alert("Firestore document missing!");
    state = snap.data();
    state.mothCount++;
    state.hunts.push(`🦋 ${new Date().toLocaleString()}`);
    state.xp += 10;
    while (state.xp >= state.level * 50) { state.xp -= state.level * 50; state.level++; }
    await updateDoc(statsRef, state);
  } catch (err) { alert("Error: " + err.message); }
}

async function resetMoths() {
  if (!isAdmin) return;
  try {
    const snap = await getDoc(statsRef);
    if (!snap.exists()) return alert("Firestore document missing!");
    state = snap.data();
    state.mothCount = 0; state.xp = 0; state.level = 1; state.hunts = [];
    await updateDoc(statsRef, state);
  } catch (err) { alert("Error: " + err.message); }
}

function renderTrophies() {
  const trophyList = document.getElementById("trophyList");
  trophyList.innerHTML = "";

  trophyMilestones.forEach((t, i) => {
    const li = document.createElement("li");
    li.textContent = `${t.icon} ${t.trophy} (${t.count})`;
    if (state.mothCount >= t.count) li.classList.add("earned");
    else li.style.color = "#aaa";
    trophyList.appendChild(li);
  });
}

onSnapshot(statsRef, snap => {
  if (snap.exists()) { state = snap.data(); render(); }
});

window.addMoth = addMoth;
window.resetMoths = resetMoths;
document.getElementById("addMothBtn").addEventListener("click", addMoth);
document.getElementById("resetMothBtn").addEventListener("click", resetMoths);

</script>
</body>
</html>
