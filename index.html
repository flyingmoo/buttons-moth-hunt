<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buttons Moth Kill Count 🐱</title>
<style>
body { 
  font-family: 'Segoe UI', sans-serif; 
  background: #f0f0f0; 
  margin: 0; 
  padding: 0; 
  display: flex; 
  justify-content: center; 
  align-items: flex-start; 
  min-height: 100vh;
}

.frame {
  background: white;
  border-radius: 15px;
  box-shadow: 0 10px 20px rgba(0,0,0,0.15);
  padding: 30px;
  margin: 20px;
  max-width: 500px;
  width: 100%;
  text-align: center;
}

img { 
  max-width: 300px; 
  border-radius: 10px; 
  margin-bottom: 20px; 
}

.stats { 
  margin: 20px; 
  font-size: 18px; 
}

button { 
  font-size: 18px; 
  padding: 12px 25px; 
  margin: 5px; 
  border: none; 
  border-radius: 8px; 
  cursor: pointer; 
  transition: all 0.2s ease; 
  box-shadow: 0 4px 6px rgba(0,0,0,0.1);
}
button:disabled { 
  opacity: 0.5; 
  cursor: not-allowed; 
}
#addMothBtn { background: #4CAF50; color: white; }
#addMothBtn:hover:not(:disabled) { background: #45a049; transform: translateY(-2px); }
#resetMothBtn { background: #f44336; color: white; }
#resetMothBtn:hover:not(:disabled) { background: #e53935; transform: translateY(-2px); }

#login input { padding: 8px; margin: 0 5px; border-radius: 5px; border: 1px solid #ccc; }
#login button { padding: 8px 15px; border-radius: 5px; }

.trophies { 
  margin: 20px auto; 
  text-align: left; 
}
.trophies h2 { 
  font-size: 22px; 
  margin-bottom: 10px; 
}
.trophies ul { 
  list-style: none; 
  padding: 0; 
  columns: 2; 
  column-gap: 20px;
}
.trophies li { 
  padding: 5px 0; 
  font-size: 18px; 
  display: flex;
  align-items: center;
}
.trophies li.earned { 
  color: gold; 
  font-weight: bold; 
  transform: scale(1.05);
  transition: transform 0.2s ease;
}
.trophies li.earned:hover {
  transform: scale(1.2);
}
</style>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>
</head>
<body>

<div class="frame">
  <h1>Buttons Moth Kill Count 🐱</h1>
  <img src="buttons.jpg" alt="Buttons the Cat">

  <div class="stats">
    <p>Moths hunted: <span id="mothCount">0</span></p>
    <p>XP: <span id="xp">0</span></p>
    <p>Level: <span id="level">1</span></p>
    <p>Title: <span id="title">Novice Hunter</span></p>
  </div>

  <div>
    <button id="addMothBtn" disabled>+1 Moth</button>
    <button id="resetMothBtn" disabled>Reset Moths</button>
  </div>

  <div class="trophies">
    <h2>Trophies 🏆</h2>
    <ul id="trophyList"></ul>
  </div>

  <div id="login" style="margin-top: 20px;">
    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">
    <button onclick="login()">Admin Login</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, updateDoc, onSnapshot, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// 🔹 Replace with your Firebase Web App values
const firebaseConfig = {
  apiKey: "AIzaSyC1HnYKrEwO4uEF1VluSzHnr0EgOUYHhUs",
  authDomain: "buttons-moth-rpg.firebaseapp.com",
  projectId: "buttons-moth-rpg"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const statsRef = doc(db, "stats", "buttons");

let state = { mothCount: 0, xp: 0, level: 1, hunts: [] };
let isAdmin = false;

// Trophy milestones with icons
const trophyMilestones = [
  { count: 1, icon: "🦋" },
  { count: 5, icon: "🐾" },
  { count: 10, icon: "🏅" },
  { count: 15, icon: "🎖️" },
  { count: 20, icon: "🏆" },
  { count: 30, icon: "🥇" },
  { count: 40, icon: "🥈" },
  { count: 50, icon: "🥉" },
  { count: 60, icon: "💎" },
  { count: 70, icon: "👑" },
  { count: 80, icon: "🔥" },
  { count: 90, icon: "⚡" },
  { count: 100, icon: "🌟" }
];

// Login
window.login = async function() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  try {
    const userCredential = await signInWithEmailAndPassword(auth, email, password);
    console.log("Login successful! UID:", userCredential.user.uid);
    alert("Logged in as admin!");
  } catch (err) {
    console.error("Login failed:", err);
    alert("Login failed: " + err.message);
  }
};

// Track auth state
onAuthStateChanged(auth, user => {
  isAdmin = !!user;
  document.getElementById("addMothBtn").disabled = !isAdmin;
  document.getElementById("resetMothBtn").disabled = !isAdmin;
  document.getElementById("login").style.display = isAdmin ? "none" : "block";
});

// Render stats
function render() {
  document.getElementById("mothCount").textContent = state.mothCount;
  document.getElementById("xp").textContent = state.xp;
  document.getElementById("level").textContent = state.level;
  document.getElementById("title").textContent = getTitle(state.level);
  renderTrophies();
}

// Assign titles
function getTitle(level) {
  if (level >= 10) return "Legendary Moth Slayer";
  if (level >= 7) return "Expert Hunter";
  if (level >= 4) return "Skilled Hunter";
  return "Novice Hunter";
}

// +1 Moth
async function addMoth() {
  if (!isAdmin) return;
  try {
    const snap = await getDoc(statsRef);
    if (!snap.exists()) return alert("Firestore document missing!");
    state = snap.data();
    const now = new Date().toLocaleString();
    state.mothCount++;
    state.hunts.push(`🦋 ${now}`);
    state.xp += 10;
    while (state.xp >= state.level * 50) { state.xp -= state.level * 50; state.level++; }
    await updateDoc(statsRef, state);
    render();
  } catch (err) {
    console.error("Failed to add moth:", err);
    alert("Error: " + err.message);
  }
}

// Reset Moths
async function resetMoths() {
  if (!isAdmin) return;
  try {
    const snap = await getDoc(statsRef);
    if (!snap.exists()) return alert("Firestore document missing!");
    state = snap.data();
    state.mothCount = 0;
    state.xp = 0;
    state.level = 1;
    state.hunts = [];
    await updateDoc(statsRef, state);
    render();
  } catch (err) {
    console.error("Failed to reset moths:", err);
    alert("Error: " + err.message);
  }
}

// Trophy rendering with badges
function renderTrophies() {
  const trophyList = document.getElementById("trophyList");
  trophyList.innerHTML = "";
  trophyMilestones.forEach(t => {
    const li = document.createElement("li");
    li.textContent = `${t.icon} ${t.count} Moth${t.count > 1 ? 's' : ''}`;
    if (state.mothCount >= t.count) li.classList.add("earned");
    else li.style.color = "#aaa"; 
    trophyList.appendChild(li);
  });
}

// Real-time updates
onSnapshot(statsRef, snap => {
  if (snap.exists()) {
    state = snap.data();
    render();
  }
});

// Expose functions globally
window.addMoth = addMoth;
window.resetMoths = resetMoths;

// Attach button click handlers
document.getElementById("addMothBtn").addEventListener("click", addMoth);
document.getElementById("resetMothBtn").addEventListener("click", resetMoths);

</script>
</body>
</html>
