<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buttons Moth Tracker</title>
<style>
body { font-family: sans-serif; text-align: center; padding: 20px; background: #f0f0f0; }
img { max-width: 300px; border-radius: 10px; }
.stats { margin: 20px; font-size: 18px; }
button { font-size: 18px; padding: 10px 20px; margin: 5px; }
#login input { padding: 5px; margin: 0 5px; }
</style>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>
</head>
<body>

<h1>Buttons Moth Tracker 🐱</h1>
<img src="buttons.jpg" alt="Buttons the Cat">

<div class="stats">
  <p>Moths hunted: <span id="mothCount">0</span></p>
  <p>XP: <span id="xp">0</span></p>
  <p>Level: <span id="level">1</span></p>
  <p>Title: <span id="title">Novice Hunter</span></p>
</div>

<div>
  <button id="addMothBtn" disabled>+1 Moth</button>
  <button id="resetMothBtn" disabled>Reset Moths</button>
</div>

<div id="login" style="margin-top: 20px;">
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button onclick="login()">Admin Login</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, updateDoc, onSnapshot, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// 🔹 Replace with your Firebase Web App values
const firebaseConfig = {
  apiKey: "AIzaSyC1HnYKrEwO4uEF1VluSzHnr0EgOUYHhUs",
  authDomain: "buttons-moth-rpg.firebaseapp.com",
  projectId: "buttons-moth-rpg"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const statsRef = doc(db, "stats", "buttons");

let state = { mothCount: 0, xp: 0, level: 1, hunts: [] };
let isAdmin = false;

// Login
window.login = async function() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  try {
    const userCredential = await signInWithEmailAndPassword(auth, email, password);
    console.log("Login successful! UID:", userCredential.user.uid);
    alert("Logged in as admin!");
  } catch (err) {
    console.error("Login failed:", err);
    alert("Login failed: " + err.message);
  }
};

// Track auth state
onAuthStateChanged(auth, user => {
  console.log("Auth state changed. User:", user);
  isAdmin = !!user;
  document.getElementById("addMothBtn").disabled = !isAdmin;
  document.getElementById("resetMothBtn").disabled = !isAdmin;
  document.getElementById("login").style.display = isAdmin ? "none" : "block";
});

// Render stats
function render() {
  document.getElementById("mothCount").textContent = state.mothCount;
  document.getElementById("xp").textContent = state.xp;
  document.getElementById("level").textContent = state.level;
  document.getElementById("title").textContent = getTitle(state.level);
}

// Assign titles
function getTitle(level) {
  if (level >= 10) return "Legendary Moth Slayer";
  if (level >= 7) return "Expert Hunter";
  if (level >= 4) return "Skilled Hunter";
  return "Novice Hunter";
}

// +1 Moth
async function addMoth(event) {
  if (!isAdmin) { console.log("Not admin, cannot add moth."); return; }
  try {
    const snap = await getDoc(statsRef);
    if (!snap.exists()) {
      console.error("Document stats/buttons does not exist!");
      alert("Firestore document missing!");
      return;
    }
    state = snap.data();
    const now = new Date().toLocaleString();
    state.mothCount++;
    state.hunts.push(`🦋 ${now}`);
    state.xp += 10;
    while (state.xp >= state.level * 50) { state.xp -= state.level * 50; state.level++; }
    await updateDoc(statsRef, state);
    console.log("Moth added successfully! New state:", state);
    render();
  } catch (err) {
    console.error("Failed to add moth:", err);
    alert("Error: " + err.message);
  }
}

// Reset Moths
async function resetMoths() {
  if (!isAdmin) { console.log("Not admin, cannot reset moths."); return; }
  try {
    const snap = await getDoc(statsRef);
    if (!snap.exists()) {
      console.error("Document stats/buttons does not exist!");
      alert("Firestore document missing!");
      return;
    }
    state = snap.data();
    state.mothCount = 0;
    state.xp = 0;
    state.level = 1;
    state.hunts = [];
    await updateDoc(statsRef, state);
    console.log("Moth count reset! New state:", state);
    render();
  } catch (err) {
    console.error("Failed to reset moths:", err);
    alert("Error: " + err.message);
  }
}

// Real-time updates
onSnapshot(statsRef, snap => {
  if (snap.exists()) {
    state = snap.data();
    render();
  } else {
    console.warn("Stats document does not exist!");
  }
});

// 🔹 Fix for module scripts: expose functions globally
window.addMoth = addMoth;
window.resetMoths = resetMoths;

// Attach button click handlers via JS
document.getElementById("addMothBtn").addEventListener("click", addMoth);
document.getElementById("resetMothBtn").addEventListener("click", resetMoths);

</script>
</body>
</html>
